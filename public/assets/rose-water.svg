<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="roseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6"/>
      <stop offset="50%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#BE185D"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="waterDroplet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="50" cy="50" r="46" fill="#FCE7F3" stroke="#F472B6" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FBCFE8" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Rose Stem & Leaves -->
  <path d="M 28 65 C 38 60, 42 75, 48 70" stroke="#059669" stroke-width="2.5" fill="none"/>
  <path d="M 32 62 C 24 55, 30 45, 38 52 Z" fill="url(#leafGreen)"/>

  <!-- Stylized Rose Petals -->
  <circle cx="50" cy="46" r="22" fill="#FDF2F8"/>
  <!-- Outer Petals -->
  <path d="M 50 26 C 36 26, 32 40, 40 48 C 30 52, 38 68, 50 68 C 62 68, 70 52, 60 48 C 68 40, 64 26, 50 26 Z" fill="url(#roseGradient)"/>
  <!-- Inner Swirl Petal -->
  <path d="M 50 34 C 44 34, 42 42, 47 46 C 43 49, 46 56, 50 56 C 54 56, 57 49, 53 46 C 58 42, 56 34, 50 34 Z" fill="#F472B6"/>
  <circle cx="50" cy="45" r="4" fill="#BE185D"/>

  <!-- Pure Dew Droplet -->
  <path d="M 66 54 C 66 54, 76 66, 76 74 C 76 79, 72 84, 66 84 C 60 84, 56 79, 56 74 C 56 66, 66 54, 66 54 Z" fill="url(#waterDroplet)" stroke="#38BDF8" stroke-width="1"/>
  <ellipse cx="64" cy="72" rx="2" ry="4" transform="rotate(-20 64 72)" fill="#FFFFFF" opacity="0.85"/>
</svg>
