<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 520" width="100%" height="100%">
  <defs>
    <!-- Midnight Violet Jar Gradient -->
    <linearGradient id="nightJarBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1035"/>
      <stop offset="25%" stop-color="#3B1D6B"/>
      <stop offset="60%" stop-color="#2D1554"/>
      <stop offset="85%" stop-color="#3B1D6B"/>
      <stop offset="100%" stop-color="#150B25"/>
    </linearGradient>

    <!-- Metallic Cap Gradient (Champagne Gold) -->
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7B38"/>
      <stop offset="25%" stop-color="#FDE68A"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#785514"/>
    </linearGradient>

    <linearGradient id="nightAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <filter id="jarShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#8B5CF6" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#05020B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow & Contact Shadow -->
  <ellipse cx="225" cy="460" rx="140" ry="24" fill="#8B5CF6" opacity="0.3" filter="blur(20px)"/>
  <ellipse cx="225" cy="455" rx="110" ry="15" fill="#090514" opacity="0.6"/>

  <g filter="url(#jarShadow)">
    <!-- Gold Metallic Screw Cap -->
    <path d="M 120 160 L 330 160 C 335 160, 340 165, 340 172 L 340 230 C 340 237, 335 242, 330 242 L 120 242 C 115 242, 110 237, 110 230 L 110 172 C 110 165, 115 160, 120 160 Z" fill="url(#goldCap)" stroke="#D97706" stroke-width="1.5"/>
    
    <!-- Cap Horizontal Brushed Lines -->
    <line x1="110" y1="180" x2="340" y2="180" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
    <line x1="110" y1="222" x2="340" y2="222" stroke="rgba(0,0,0,0.25)" stroke-width="1.5"/>
    <!-- Specular Highlight on cap -->
    <rect x="155" y="162" width="25" height="78" fill="#FFFFFF" opacity="0.45"/>

    <!-- Crescent Moon Emblem on Cap Center -->
    <circle cx="225" cy="201" r="14" fill="#FEF3C7" opacity="0.9"/>
    <circle cx="229" cy="199" r="12" fill="#D97706"/>

    <!-- Jar Glass Body (Heavyweight Cosmetic Pot) -->
    <path d="M 125 240 L 325 240 C 335 240, 345 250, 345 262 L 340 425 C 340 445, 325 455, 305 455 L 145 455 C 125 455, 110 445, 110 425 L 105 262 C 105 250, 115 240, 125 240 Z" fill="url(#nightJarBody)" stroke="#6D28D9" stroke-width="1.5"/>

    <!-- Glass Specular Curve Reflection -->
    <path d="M 120 255 L 120 425 C 120 438, 128 444, 138 445 L 138 255 Z" fill="#C4B5FD" opacity="0.3"/>
    <line x1="145" y1="255" x2="145" y2="435" stroke="#FFFFFF" stroke-width="2" opacity="0.5"/>

    <!-- Modern Luxury Label Shield -->
    <rect x="145" y="270" width="160" height="150" rx="10" fill="#0C0617" stroke="#A78BFA" stroke-width="1.2"/>
    <rect x="149" y="274" width="152" height="142" rx="7" fill="none" stroke="#7C3AED" stroke-width="0.8" stroke-dasharray="3 3"/>

    <!-- Brand Header -->
    <text x="225" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ANJUCIA</text>
    <text x="225" y="313" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="1.8">HAUTE NUTRITION CELLULAIRE</text>

    <line x1="165" y1="322" x2="285" y2="322" stroke="#4C1D95" stroke-width="1"/>

    <!-- Product Title -->
    <text x="225" y="342" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#E9D5FF" text-anchor="middle">ECTO-REPAIR BALM</text>
    <text x="225" y="356" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#A78BFA" text-anchor="middle">BAUME NUIT RÉCUPÉRATION 72H</text>

    <!-- Actives -->
    <text x="225" y="375" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#FBBF24" text-anchor="middle">ÉCTOÏNE 2.5% • DATTE DU SAHARA 3%</text>

    <!-- Volume -->
    <rect x="185" y="388" width="80" height="18" rx="9" fill="#2E1065" stroke="#8B5CF6" stroke-width="1"/>
    <text x="225" y="400" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="900" fill="#DDD6FE" text-anchor="middle">50 ml ℮ NUIT</text>
  </g>
</svg>
