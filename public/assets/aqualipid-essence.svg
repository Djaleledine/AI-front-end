<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 520" width="100%" height="100%">
  <defs>
    <!-- Glass Bottle Gradient -->
    <linearGradient id="glassBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="20%" stop-color="#F0F9FF"/>
      <stop offset="60%" stop-color="#BAE6FD" stop-opacity="0.8"/>
      <stop offset="85%" stop-color="#F0F9FF"/>
      <stop offset="100%" stop-color="#7DD3FC" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Liquid Fluid Inside -->
    <linearGradient id="liquidFluid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2C4" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Dropper Bulb Gradient -->
    <linearGradient id="dropperBulb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="35%" stop-color="#64748B"/>
      <stop offset="70%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Silver Collar -->
    <linearGradient id="silverCollar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <filter id="essenceShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0284C7" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1320" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ambient Glow & Contact Shadow -->
  <ellipse cx="225" cy="465" rx="115" ry="22" fill="#00D2C4" opacity="0.25" filter="blur(16px)"/>
  <ellipse cx="225" cy="460" rx="80" ry="12" fill="#0F172A" opacity="0.4"/>

  <g filter="url(#essenceShadow)">
    <!-- Dropper Rubber Bulb -->
    <path d="M 210 50 C 210 35, 240 35, 240 50 L 238 90 L 212 90 Z" fill="url(#dropperBulb)"/>
    <ellipse cx="225" cy="45" rx="14" ry="7" fill="#64748B"/>

    <!-- Metallic Dropper Collar -->
    <rect x="200" y="90" width="50" height="24" rx="3" fill="url(#silverCollar)" stroke="#94A3B8" stroke-width="1"/>
    <line x1="200" y1="102" x2="250" y2="102" stroke="#64748B" stroke-width="1"/>

    <!-- Glass Pipette Stem passing inside -->
    <rect x="221" y="114" width="8" height="290" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1" opacity="0.85"/>
    <path d="M 221 404 L 225 418 L 229 404 Z" fill="#BAE6FD"/>

    <!-- Glass Bottle Body (Cylindrical Apothecary Bottle) -->
    <rect x="160" y="145" width="130" height="305" rx="18" fill="url(#glassBody)" stroke="#93C5FD" stroke-width="1.5"/>

    <!-- Fluid Level with meniscus -->
    <path d="M 164 220 Q 225 214 286 220 L 286 438 Q 225 450 164 438 Z" fill="url(#liquidFluid)"/>

    <!-- Glass Specular Highlight -->
    <rect x="170" y="160" width="12" height="270" rx="6" fill="#FFFFFF" opacity="0.75"/>
    <rect x="186" y="170" width="4" height="250" rx="2" fill="#FFFFFF" opacity="0.45"/>

    <!-- Pipette Dropper Measurement Marks on Bottle -->
    <line x1="164" y1="240" x2="176" y2="240" stroke="#0284C7" stroke-width="1.5"/>
    <text x="180" y="243" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#0284C7">80ml</text>

    <line x1="164" y1="290" x2="176" y2="290" stroke="#0284C7" stroke-width="1.5"/>
    <text x="180" y="293" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#0284C7">60ml</text>

    <line x1="164" y1="340" x2="176" y2="340" stroke="#0284C7" stroke-width="1.5"/>
    <text x="180" y="343" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#0284C7">40ml</text>

    <line x1="164" y1="390" x2="176" y2="390" stroke="#0284C7" stroke-width="1.5"/>
    <text x="180" y="393" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#0284C7">20ml</text>

    <!-- Clinical Label Badge on Glass -->
    <rect x="185" y="255" width="80" height="135" rx="8" fill="rgba(255,255,255,0.92)" stroke="#BAE6FD" stroke-width="1"/>
    
    <text x="225" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="2">ANJUCIA</text>
    <text x="225" y="290" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="800" fill="#00D2C4" text-anchor="middle" letter-spacing="1">LABORATOIRE</text>

    <line x1="195" y1="296" x2="255" y2="296" stroke="#E2E8F0" stroke-width="1"/>

    <text x="225" y="312" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="900" fill="#0369A1" text-anchor="middle">AQUALIPID</text>
    <text x="225" y="323" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#64748B" text-anchor="middle">HYDRO-INFUSION</text>
    <text x="225" y="333" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#0284C7" text-anchor="middle">PGA 1.5% • B5 4.0%</text>

    <rect x="195" y="344" width="60" height="16" rx="8" fill="#E0F2FE"/>
    <text x="225" y="355" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="900" fill="#0369A1" text-anchor="middle">BOOSTER 3.2X</text>

    <text x="225" y="377" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#0F172A" text-anchor="middle">100 ml ℮</text>
  </g>
</svg>
