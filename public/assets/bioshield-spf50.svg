<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 520" width="100%" height="100%">
  <defs>
    <!-- Shaker Bottle Gradients -->
    <linearGradient id="spfBottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#EEF2F6"/>
      <stop offset="85%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <linearGradient id="goldOrangeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>

    <linearGradient id="spfShieldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>

    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="35%" stop-color="#FDBA74"/>
      <stop offset="70%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </linearGradient>

    <filter id="bottleShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#EA580C" flood-opacity="0.2"/>
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1320" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Ambient Shadow & Glow -->
  <ellipse cx="225" cy="465" rx="120" ry="22" fill="#F59E0B" opacity="0.22" filter="blur(16px)"/>
  <ellipse cx="225" cy="460" rx="85" ry="12" fill="#0F172A" opacity="0.4"/>

  <g filter="url(#bottleShadow)">
    <!-- Protective Cap / Precision Nozzle -->
    <path d="M 213 70 L 237 70 L 239 125 L 211 125 Z" fill="#FED7AA" stroke="#FB923C" stroke-width="1"/>
    <!-- Angled Cap Ribs -->
    <path d="M 195 125 L 255 125 L 260 180 L 190 180 Z" fill="url(#capGradient)" rx="4"/>
    <line x1="202" y1="130" x2="202" y2="175" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="214" y1="130" x2="214" y2="175" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="225" y1="130" x2="225" y2="175" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
    <line x1="236" y1="130" x2="236" y2="175" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <line x1="248" y1="130" x2="248" y2="175" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>

    <!-- Bottle Body (Ergonomic Shaker) -->
    <path d="M 175 180 C 175 180, 150 205, 150 250 L 150 425 C 150 445, 165 455, 185 455 L 265 455 C 285 455, 300 445, 300 425 L 300 250 C 300 205, 275 180, 275 180 Z" fill="url(#spfBottle)" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Subtle bottle glass reflection specular -->
    <path d="M 160 250 L 160 420 C 160 432, 168 440, 178 442 L 178 250 Z" fill="#FFFFFF" opacity="0.65"/>
    <line x1="184" y1="240" x2="184" y2="435" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

    <!-- Sun Shield Crest / Graphic -->
    <circle cx="225" cy="245" r="28" fill="url(#spfShieldBadge)" stroke="#F59E0B" stroke-width="1.5"/>
    <circle cx="225" cy="245" r="23" fill="none" stroke="#F59E0B" stroke-width="1" stroke-dasharray="2 3"/>
    <!-- Sun Rays icon -->
    <path d="M 225 228 L 225 224 M 225 266 L 225 262 M 208 245 L 204 245 M 246 245 L 242 245 M 213 233 L 210 230 M 237 257 L 240 260 M 213 257 L 210 260 M 237 233 L 240 230" stroke="#D97706" stroke-width="2" stroke-linecap="round"/>
    <circle cx="225" cy="245" r="8" fill="#F59E0B"/>

    <!-- Brand Typography -->
    <text x="225" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="3">ANJUCIA</text>
    <text x="225" y="314" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="800" fill="#F59E0B" text-anchor="middle" letter-spacing="2.2">DERMACEUTICAL LAB</text>

    <!-- Product Title -->
    <text x="225" y="338" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="900" fill="#1E293B" text-anchor="middle">BIOSHIELD SPF 50+</text>
    <text x="225" y="352" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">FLUIDE INVISIBLE HAUTE PRÉCISION</text>

    <!-- SPF Badge Pill -->
    <rect x="180" y="365" width="90" height="22" rx="11" fill="url(#goldOrangeAccent)"/>
    <text x="225" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">PA++++ • TEWL-LOCK</text>

    <!-- Volume & Origin -->
    <text x="225" y="410" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#0F172A" text-anchor="middle">50 ml ℮ 1.7 FL. OZ.</text>
    <text x="225" y="424" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="800" fill="#10B981" text-anchor="middle" letter-spacing="1">FORMULÉ EN ALGÉRIE 🇩🇿</text>

    <!-- Base curve rim -->
    <path d="M 170 450 Q 225 460 280 450" stroke="#CBD5E1" stroke-width="1.5" fill="none"/>
  </g>
</svg>
