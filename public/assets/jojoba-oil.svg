<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="jojobaSeed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="50%" stop-color="#A16207"/>
      <stop offset="100%" stop-color="#713F12"/>
    </linearGradient>
    <linearGradient id="jojobaOilDrop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
    <linearGradient id="jojobaLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16"/>
      <stop offset="100%" stop-color="#4D7C0F"/>
    </linearGradient>
  </defs>
  <!-- Background Badge Circle -->
  <circle cx="50" cy="50" r="46" fill="#FEFCE8" stroke="#EAB308" stroke-width="2"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#FEF08A" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Stem & Leaves -->
  <path d="M 25 70 C 35 60, 45 45, 55 35" stroke="#4D7C0F" stroke-width="2.5" fill="none"/>
  <path d="M 40 45 C 32 38, 38 26, 48 35 Z" fill="url(#jojobaLeaf)"/>
  <path d="M 52 38 C 50 26, 62 25, 60 38 Z" fill="url(#jojobaLeaf)"/>

  <!-- Jojoba Capsule / Nut -->
  <path d="M 46 48 C 56 36, 68 46, 62 62 C 56 74, 42 70, 38 60 C 35 52, 42 45, 46 48 Z" fill="url(#jojobaSeed)"/>

  <!-- Biomimetic Golden Lipid Droplet -->
