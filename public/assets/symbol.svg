<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="symAquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2C4"/>
      <stop offset="100%" stop-color="#009E96"/>
    </linearGradient>
    <linearGradient id="symNavyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142338"/>
      <stop offset="100%" stop-color="#0B1726"/>
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C2CB" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g transform="translate(0, 5)">
    <!-- Left Leg of A -->
    <path d="M 110 10 L 10 230 L 45 230 L 110 65 Z" fill="url(#symNavyGrad)"/>
    <!-- Right Leg of A -->
    <path d="M 110 10 L 210 230 L 175 230 L 110 65 Z" fill="url(#symNavyGrad)"/>
    <!-- Apex Cap Join -->
    <path d="M 97 38 L 110 10 L 123 38 Z" fill="url(#symNavyGrad)"/>

    <!-- Active Bio-Moisture Droplet inside apex -->
    <path d="M 110 95 C 110 95, 88 140, 88 155 C 88 167, 98 177, 110 177 C 122 177, 132 167, 132 155 C 132 140, 110 95, 110 95 Z" 
          fill="url(#symAquaGrad)" filter="url(#symGlow)"/>

    <!-- Lipid Bridge (Curved Aqua Arch) -->
    <path d="M 64 172 C 84 198, 136 198, 156 172 C 158 169, 163 172, 160 177 C 136 208, 84 208, 60 177 C 58 172, 62 169, 64 172 Z" 
          fill="url(#symAquaGrad)" filter="url(#symGlow)"/>
  </g>
</svg>
