<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2C4"/>
      <stop offset="100%" stop-color="#009E96"/>
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#142338"/>
      <stop offset="100%" stop-color="#0B1726"/>
    </linearGradient>
    <filter id="aquaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00C2CB" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Architectural 'A' Monogram Mark -->
  <g id="monogram" transform="translate(140, 20)">
    <!-- Left Leg of A -->
    <path d="M 110 10 L 10 230 L 45 230 L 110 65 Z" fill="url(#navyGrad)"/>
    <!-- Right Leg of A -->
    <path d="M 110 10 L 210 230 L 175 230 L 110 65 Z" fill="url(#navyGrad)"/>
    <!-- Apex Cap Join -->
    <path d="M 97 38 L 110 10 L 123 38 Z" fill="url(#navyGrad)"/>

    <!-- Active Bio-Moisture Droplet inside apex -->
    <path d="M 110 95 C 110 95, 88 140, 88 155 C 88 167, 98 177, 110 177 C 122 177, 132 167, 132 155 C 132 140, 110 95, 110 95 Z" 
          fill="url(#aquaGrad)" filter="url(#aquaGlow)"/>

    <!-- Lipid Bridge (Curved Aqua Arch) -->
    <path d="M 64 172 C 84 198, 136 198, 156 172 C 158 169, 163 172, 160 177 C 136 208, 84 208, 60 177 C 58 172, 62 169, 64 172 Z" 
          fill="url(#aquaGrad)" filter="url(#aquaGlow)"/>
  </g>

  <!-- ANJUCIA Brand Name -->
  <text x="250" y="325" 
        text-anchor="middle" 
        fill="#0D1D2E" 
        font-family="system-ui, -apple-system, 'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="44" 
        font-weight="800" 
        letter-spacing="14">
    ANJUCIA
  </text>

  <!-- Dermaceutical Hydration Subtitle -->
  <text x="250" y="365" 
        text-anchor="middle" 
        fill="#5A6E85" 
        font-family="system-ui, -apple-system, 'Inter', 'Montserrat', 'Segoe UI', sans-serif" 
        font-size="16" 
        font-weight="500" 
        letter-spacing="9">
    DERMACEUTICAL HYDRATION
  </text>
</svg>
